<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WireGuard4582 | Panel Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b1b;color:#fff;font-family:Tahoma,Arial,sans-serif;padding:20px}
main{max-width:650px;margin:auto}
header{text-align:center;padding:30px 10px}
.logo{width:75px;height:75px;border-radius:22px;margin:auto;background:linear-gradient(135deg,#9333ea,#38bdf8);display:grid;place-items:center;font-size:30px;font-weight:bold}
h1{font-size:25px}
header p{color:#aaa9d5;font-size:12px}
.card{background:#15152b;border:1px solid #37345f;border-radius:18px;padding:20px;margin-bottom:18px}
h2{font-size:17px;margin-top:0}
label{display:block;font-size:12px;margin:17px 0 8px;color:#d7d5ff}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #3d3a65;background:#0b1020;color:white;font-size:14px}
button{width:100%;padding:14px;border:0;border-radius:11px;background:linear-gradient(100deg,#9333ea,#4263eb,#0ea5e9);color:white;font-size:14px;font-weight:bold;margin-top:18px;cursor:pointer}
#status{display:none;margin-top:15px;padding:12px;border-radius:10px;background:#102b27;color:#a7f3d0;font-size:12px;line-height:2}
.note{font-size:11px;color:#aaa9c9;line-height:2}
</style>
</head>
<body>
<main>
<header>
<div class="logo">WG</div>
<h1>WireGuard4582</h1>
<p>پنل‌ساز اختصاصی وایرگارد</p>
</header>

<section class="card">
<h2>🏗️ ساخت پنل جدید</h2>

<label for="panelName">اسم پنل</label>
<input id="panelName" placeholder="اسم پنل دلخواه">

<label for="panelPass">رمز عبور پنل</label>
<input id="panelPass" type="password" placeholder="رمز پنل را انتخاب کن">

<label for="volume">حجم پیش‌فرض (GB)</label>
<input id="volume" type="number" min="1" value="4">

<label for="days">اعتبار پیش‌فرض (روز)</label>
<input id="days" type="number" min="1" value="30">

<label for="users">تعداد کاربران</label>
<input id="users" type="number" min="1" value="1">

<button onclick="createPanel()">ساخت و دریافت فایل پنل</button>
<div id="status"></div>

<p class="note">
این ابزار فایل HTML پنل اختصاصی را تولید می‌کند. برای اینکه پنل ساخته‌شده واقعاً کانفیگ جدید بسازد، کلیدهای جدید تولید کند و لینک ساب فعال داشته باشد، باید به سرور WireGuard متصل شود.
</p>
</section>
</main>

<script>
function createPanel(){
 const name=document.getElementById('panelName').value.trim();
 const pass=document.getElementById('panelPass').value;
 const volume=Number(document.getElementById('volume').value);
 const days=Number(document.getElementById('days').value);
 const users=Number(document.getElementById('users').value);
 const status=document.getElementById('status');

 if(!name||!pass){
  alert('اسم و رمز پنل را وارد کن.');
  return;
 }
 if(!volume||volume<1||!days||days<1||!users||users<1){
  alert('حجم، اعتبار و کاربران باید بیشتر از صفر باشند.');
  return;
 }

 const settings={
  name:name,
  volume:volume,
  days:days,
  users:users
 };

 const settingsJSON=JSON.stringify(settings).replace(/</g,'\\u003c');

 const panel=`<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${escapeHtml(name)}</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b1b;color:#fff;font-family:Tahoma,Arial,sans-serif;padding:20px}
main{max-width:600px;margin:auto}
.card{background:#15152b;border:1px solid #494078;border-radius:18px;padding:20px;margin:20px 0}
h1{text-align:center;font-size:23px}
label{display:block;font-size:12px;margin:15px 0 8px}
input{width:100%;padding:12px;background:#0b1020;color:white;border:1px solid #494078;border-radius:10px}
button{width:100%;padding:13px;margin-top:15px;border:0;border-radius:10px;background:linear-gradient(100deg,#9333ea,#0ea5e9);color:white;font-weight:bold}
.hidden{display:none}
p{font-size:12px;color:#c4c4e9;line-height:2}
</style>
</head>
<body>
<main>
<h1 id="heading"></h1>
<section class="card" id="login">
<h3>ورود به پنل</h3>
<label>رمز عبور</label>
<input id="password" type="password">
<button onclick="login()">ورود</button>
<p id="error"></p>
</section>
<section class="card hidden" id="app">
<h3>ساخت خروجی وایرگارد</h3>
<label>فایل کانفیگ اصلی (.conf)</label>
<input id="file" type="file" accept=".conf,.txt">
<label>نام کانفیگ</label>
<input id="configName" placeholder="نام کانفیگ">
<label>حجم (GB)</label>
<input id="v" type="number" min="1">
<label>اعتبار (روز)</label>
<input id="d" type="number" min="1">
<label>تعداد کاربران</label>
<input id="u" type="number" min="1">
<button onclick="build()">آماده‌سازی کانفیگ</button>
<p id="result"></p>
<button id="download" class="hidden" onclick="download()">دانلود کانفیگ</button>
<p>این نسخه فایل ورودی را دانلود می‌کند؛ اعمال محدودیت‌ها و تولید Peer جدید به سرور نیاز دارد.</p>
</section>
</main>
<script>
const settings=${settingsJSON};
document.getElementById('heading').textContent=settings.name;
document.getElementById('v').value=settings.volume;
document.getElementById('d').value=settings.days;
document.getElementById('u').value=settings.users;
let output='',filename='WireGuard.conf';
function login(){
 if(document.getElementById('password').value===${JSON.stringify(pass)}){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
 }else document.getElementById('error').textContent='رمز واردشده صحیح نیست.';
}
function build(){
 const f=document.getElementById('file').files[0];
 if(!f){alert('فایل کانفیگ را انتخاب کن.');return}
 if(+document.getElementById('v').value<1||+document.getElementById('d').value<1||+document.getElementById('u').value<1){alert('مقادیر را بررسی کن.');return}
 const r=new FileReader();
 r.onload=()=>{
  if(!String(r.result).includes('[Interface]')){alert('فایل WireGuard معتبر نیست.');return}
  output=r.result;
  filename=(document.getElementById('configName').value.trim()||f.name.replace(/\\.conf$/i,''))+'.conf';
  document.getElementById('result').textContent='فایل آماده است؛ تنظیمات حجم و اعتبار روی سرور اعمال نشده‌اند.';
  document.getElementById('download').classList.remove('hidden');
 };
 r.readAsText(f);
}
function download(){
 const a=document.createElement('a');
 const url=URL.createObjectURL(new Blob([output],{type:'application/octet-stream'}));
 a.href=url;a.download=filename;a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
<\/script>
</body>
</html>`;

 const blob=new Blob([panel],{type:'text/html;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download=name.replace(/[^a-zA-Z0-9_-]/g,'_')+'-panel.html';
 a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);

 status.style.display='block';
 status.textContent='فایل پنل ساخته شد. برای استفاده، فایل دانلودشده را باز کن.';
}
function escapeHtml(s){
 return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
  </html>
